# Live vector stores for raglib's integration tests (tests/integration/).
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   pytest -q -rs tests/integration
#   docker compose -f docker-compose.test.yml down -v
#
# The tests connect to the ports below by default (override with RAGLIB_TEST_PG_DSN and
# RAGLIB_TEST_QDRANT_URL) and are skipped when a server is not running.
# Postgres listens on 5433 so it does not clash with a local server on 5432. Keep the Qdrant
# server within one minor version of the qdrant-client you test with.
#
# Qdrant is pinned to the newest version tested in CI. To test another one (CI also runs the
# oldest supported, v1.10.1, with qdrant-client 1.10.1):
#   QDRANT_VERSION=v1.10.1 docker compose -f docker-compose.test.yml up -d --wait
services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.20.2}
    ports: ["6333:6333"]
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp is enough to see the HTTP port answer.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
