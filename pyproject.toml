[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "raglib-py"
version = "2.0.1"
description = "Modular Retrieval-Augmented Generation: hybrid search, reranking, CRAG, Self-RAG, agentic and GraphRAG pipelines"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "raglib maintainers" }
]
requires-python = ">=3.9"
# The core is pure Python (BM25, in-memory vectors, all pipelines). Everything else is an extra.
dependencies = []
keywords = ["rag", "llm", "retrieval", "ai", "nlp", "vector-search", "graphrag", "hybrid-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
raglib = "raglib.cli:main"

[project.urls]
Homepage = "https://github.com/himanshuhs9011/raglib"
Documentation = "https://github.com/himanshuhs9011/raglib/blob/main/docs/USAGE.md"
Repository = "https://github.com/himanshuhs9011/raglib"
"Bug Tracker" = "https://github.com/himanshuhs9011/raglib/issues"

[project.optional-dependencies]
# chat / embedding providers
# "openai" also covers OpenRouter, DeepSeek, Mistral, Together, Fireworks, xAI, Perplexity,
# Cerebras, Azure OpenAI, LM Studio, vLLM and any other OpenAI-compatible API.
openai = ["langchain-core>=0.2.0", "langchain-openai>=0.1.0"]
openrouter = ["langchain-core>=0.2.0", "langchain-openai>=0.1.0"]
anthropic = ["langchain-core>=0.2.0", "langchain-anthropic>=0.1.0"]
groq = ["langchain-core>=0.2.0", "langchain-groq>=0.1.0"]
google = ["langchain-core>=0.2.0", "langchain-google-genai>=1.0.0"]
ollama = ["langchain-core>=0.2.0", "langchain-ollama>=0.1.0"]
hf = ["langchain-huggingface>=0.0.3", "sentence-transformers>=2.6.0"]
# retrieval quality
rerank = ["sentence-transformers>=2.6.0"]
cohere = ["cohere>=5.0.0"]
fast = ["numpy>=1.24", "tiktoken>=0.5.0"]
# storage
chroma = ["chromadb>=0.5.0"]
graph = ["networkx>=3.0"]
leiden = ["networkx>=3.0", "graspologic>=3.3"]
neo4j = ["neo4j>=5.0", "networkx>=3.0"]
# loaders
pdf = ["PyMuPDF>=1.23.0"]
docx = ["python-docx>=1.0.0"]
pptx = ["python-pptx>=0.6.21"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
# web search
web = ["ddgs>=6.0.0"]
tavily = ["tavily-python>=0.2.0"]
serpapi = ["google-search-results>=2.4.0"]
# bundles
all-llm = [
  "langchain-core>=0.2.0",
  "langchain-openai>=0.1.0",
  "langchain-anthropic>=0.1.0",
  "langchain-groq>=0.1.0",
  "langchain-google-genai>=1.0.0",
  "langchain-ollama>=0.1.0",
]
all = [
  "langchain-core>=0.2.0",
  "langchain-openai>=0.1.0",
  "langchain-anthropic>=0.1.0",
  "langchain-groq>=0.1.0",
  "langchain-google-genai>=1.0.0",
  "langchain-ollama>=0.1.0",
  "langchain-huggingface>=0.0.3",
  "sentence-transformers>=2.6.0",
  "numpy>=1.24",
  "tiktoken>=0.5.0",
  "chromadb>=0.5.0",
  "networkx>=3.0",
  "PyMuPDF>=1.23.0",
  "python-docx>=1.0.0",
  "python-pptx>=0.6.21",
  "ddgs>=6.0.0",
]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.5.0",
  "build>=1.0.0",
  "twine>=4.0.0",
  "networkx>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["raglib"]

[tool.hatch.build.targets.sdist]
include = [
  "raglib/**/*.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
markers = [
  "e2e: End-to-end tests for the raglib facade and pipelines",
]
