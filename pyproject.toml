[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "raglib-py"
version = "2.2.0"
description = "Modular Retrieval-Augmented Generation: hybrid search, reranking, CRAG, Self-RAG, agentic and GraphRAG pipelines"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "raglib maintainers" }
]
requires-python = ">=3.9"
# The core is pure Python (BM25, in-memory vectors, all pipelines). Everything else is an extra.
dependencies = []
keywords = ["rag", "llm", "retrieval", "ai", "nlp", "vector-search", "graphrag", "hybrid-search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
raglib = "raglib.cli:main"
raglib-py = "raglib.cli:main"

[project.urls]
Homepage = "https://github.com/himanshuhs9011/raglib"
Documentation = "https://github.com/himanshuhs9011/raglib/blob/main/docs/USAGE.md"
Repository = "https://github.com/himanshuhs9011/raglib"
"Bug Tracker" = "https://github.com/himanshuhs9011/raglib/issues"

[project.optional-dependencies]
# chat / embedding providers
# Every hosted provider is reached with raglib's own HTTP clients (standard library only), so
# these extras are empty. They are kept so existing `pip install raglib-py[openai]` lines still work.
openai = []
openrouter = []
anthropic = []
groq = []
google = []
ollama = []
hf = ["sentence-transformers>=2.6.0"]
# wrap your own LangChain chat model: RAG(chat_llm=ChatOpenAI(...))
langchain = ["langchain-core>=1.3.3"]
# retrieval quality
rerank = ["sentence-transformers>=2.6.0"]
# optional local models for tier 1 guards (InjectionClassifier, ToxicityClassifier, GroundingGuard);
# models are never downloaded for you: huggingface-cli download <model id>
guards = ["transformers>=4.41", "torch>=2.1"]
cohere = ["cohere>=5.0.0"]
fast = ["numpy>=1.24", "tiktoken>=0.5.0"]
# storage
chroma = ["chromadb>=0.5.0"]
qdrant = ["qdrant-client>=1.10.0"]
pgvector = ["psycopg[binary]>=3.1"]
graph = ["networkx>=3.0"]
leiden = ["networkx>=3.0", "graspologic>=3.3"]
neo4j = ["neo4j>=5.0", "networkx>=3.0"]
# loaders
pdf = ["PyMuPDF>=1.23.0"]
docx = ["python-docx>=1.0.0"]
pptx = ["python-pptx>=0.6.21"]
xlsx = ["openpyxl>=3.1"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]
# web search
web = ["ddgs>=6.0.0"]
tavily = ["tavily-python>=0.2.0"]
serpapi = ["google-search-results>=2.4.0"]
# chunking benchmarks (benchmarks/chunking/compare_langchain.py). Pinned on purpose:
# langchain-experimental is being sunset (no longer maintained), so the comparison keeps
# running against the last release instead of breaking on a future one.
bench = [
  "langchain-experimental==0.4.2",
  "langchain-community==0.4.2",
  "langchain-core==1.8.4",
  "numpy>=1.24",
  "tiktoken>=0.5.0",
]
# observability (raglib.exporters)
prometheus = ["prometheus-client>=0.17.0"]
otel = ["opentelemetry-api>=1.45.2", "opentelemetry-sdk>=1.45.2"]
# bundles
all-llm = []
all = [
  "sentence-transformers>=2.6.0",
  "numpy>=1.24",
  "tiktoken>=0.5.0",
  "chromadb>=0.5.0",
  "networkx>=3.0",
  "PyMuPDF>=1.23.0",
  "python-docx>=1.0.0",
  "python-pptx>=0.6.21",
  "openpyxl>=3.1",
  "ddgs>=6.0.0",
]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.5.0",
  "build>=1.0.0",
  "twine>=4.0.0",
  "networkx>=3.0",
  "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["raglib"]

[tool.hatch.build.targets.sdist]
# Leading "/" anchors to the project root; a bare "README.md" also matched files in site/node_modules.
include = [
  "/raglib/**/*.py",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py39"
line-length = 130
extend-exclude = ["site", "dist"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import sorting, bugbear-lite. Pyupgrade (UP) rules are off:
# typing.List/Optional are kept deliberately for Python 3.9 support.
select = ["E", "F", "I", "B006", "B008", "B904"]
ignore = ["E501", "E731", "E741", "E402"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = false
check_untyped_defs = false

[tool.pytest.ini_options]
markers = [
  "e2e: End-to-end tests for the raglib facade and pipelines",
  "integration: Live vector-store tests (docker-compose.test.yml); skipped when the servers are not running",
]
