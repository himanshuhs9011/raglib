name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5.0"
      - run: ruff check raglib tests examples

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 24.04: ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core + offline-testable extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openai,graph,fast,chroma,qdrant,docx,pptx,xlsx,pdf]" fastapi httpx python-multipart
      - name: Unit and e2e tests (offline)
        env:
          RAGLIB_OFFLINE: "1"
        run: pytest -q -rs

  live-stores:
    # Access control, leak and filter tests against real servers (tests/integration/), with Qdrant
    # both plain and in strict mode. RAGLIB_REQUIRE_LIVE_STORES=1 fails instead of skipping when a
    # service is not reachable. Keep the images in step with docker-compose.test.yml.
    # Matrix: the oldest supported Qdrant (server and client 1.10.1, the qdrant extra's floor; it
    # has no strict mode, so those tests skip) and the newest tested one with the newest client.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qdrant: v1.10.1
            qdrant-client: "qdrant-client==1.10.1"
            python-version: "3.9"
          - qdrant: v1.20.2
            qdrant-client: "qdrant-client"
            python-version: "3.13"
    name: live-stores (qdrant ${{ matrix.qdrant }})
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:${{ matrix.qdrant }}
        ports: ["6333:6333"]
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,pgvector,qdrant]" "${{ matrix.qdrant-client }}"
      - name: Live vector-store tests
        env:
          RAGLIB_OFFLINE: "1"
          RAGLIB_REQUIRE_LIVE_STORES: "1"
          RAGLIB_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          RAGLIB_TEST_QDRANT_URL: http://localhost:6333
        run: |
          pytest -q -rs tests/integration
          pytest -q -rs tests/unit/test_v21_improvements.py -k pgvector

  security:
    # Known-vulnerable dependencies (fresh install of the extras users get, as resolved today) and
    # secrets anywhere in the git history. Heavy ML extras (torch) are left out to keep CI fast.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0  # gitleaks scans every commit
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e ".[openai,anthropic,google,cohere,langchain,chroma,qdrant,pgvector,graph,pdf,docx,pptx,xlsx,web,tavily,serpapi,prometheus,otel,fast]"
          # chromadb: four advisories in the Chroma *server* (pre-auth code injection, RBAC) with no
          # fixed release yet (checked 2026-11-26). raglib uses chromadb in-process or as a client;
          # never expose a Chroma server. Drop these ignores once chromadb ships a fix.
          pip-audit --skip-editable --progress-spinner off             --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813             --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
