name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5.0"
      - run: ruff check raglib tests examples

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 24.04: ubuntu-latest is Ubuntu 26.04, which has no Python 3.9 build.
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core + offline-testable extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,openai,graph,fast,chroma,qdrant,docx,pptx,xlsx,pdf]" fastapi httpx python-multipart
      - name: Unit and e2e tests (offline)
        env:
          RAGLIB_OFFLINE: "1"
        run: pytest -q -rs

  pgvector:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,pgvector]"
      - name: pgvector integration tests
        env:
          RAGLIB_OFFLINE: "1"
          RAGLIB_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q -rs tests/unit/test_v21_improvements.py -k pgvector
