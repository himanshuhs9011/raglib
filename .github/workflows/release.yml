name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no PyPI token is stored anywhere.
# One-time setup:
#   1. PyPI -> raglib-py -> Settings -> Publishing -> add a GitHub publisher:
#      owner himanshuhs9011, repository raglib, workflow release.yml, environment pypi.
#   2. GitHub -> Settings -> Environments -> new environment "pypi"; add yourself as a required
#      reviewer so every upload waits for your approval.
# Then a release is: bump the version, push the commit, push the tag (git tag -a vX.Y.Z; git push origin vX.Y.Z).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v${version}"; exit 1; }
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # the short-lived OIDC token PyPI accepts instead of a password
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
